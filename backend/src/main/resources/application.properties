# ==============================================================
# J. Sethuraman Portfolio - Application Configuration
# ==============================================================
# PRODUCTION: Override these with environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD, ADMIN_USERNAME, ADMIN_PASSWORD_HASH
# ==============================================================

spring.application.name=portfolio-backend
server.port=8080

# --- MySQL Data Source ---
# Set via environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sethu2026}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Session ---
spring.session.store-type=none
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# --- Admin Credentials (LOCAL DEVELOPMENT ONLY) ---
# In production, set ADMIN_USERNAME and ADMIN_PASSWORD_HASH environment variables.
# Generate BCrypt hash: use bcrypt.online or Spring Security BCryptPasswordEncoder
# Current credentials: sethu_admin / sethu@2026!
admin.username=${ADMIN_USERNAME:sethu_admin}
admin.password.hash=${ADMIN_PASSWORD_HASH:$2a$12$dP7DuEoTaUN/x6oFmEXd3e7q0kjCmktTzLp/GKeMi7RwrwbvdNaRq}

# --- Logging ---
logging.level.com.sethuraman=INFO
logging.level.org.springframework.security=WARN
logging.level.root=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# --- Jackson JSON ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Spring Mail (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:${GMAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Recipient email where portfolio messages are forwarded (defaults to user's verified Gmail)
portfolio.contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:${spring.mail.username:sethu4637@gmail.com}}
