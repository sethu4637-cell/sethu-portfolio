# ==============================================================
# J. Sethuraman Portfolio - Unified Single-Domain Docker Compose
# ==============================================================
# Starts both MySQL and the Spring Boot unified application.
# The entire frontend, admin portal, and backend APIs are served
# from ONE unified port (80 or 8080) on your domain.
# ==============================================================

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: portfolio-mysql
    restart: always
    environment:
      MYSQL_DATABASE: portfolio_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
      MYSQL_USER: ${DB_USERNAME:-portfolio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-portfolio_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database-setup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portfolio-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:mysql://db:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      - DB_USERNAME=${DB_USERNAME:-portfolio_user}
      - DB_PASSWORD=${DB_PASSWORD:-portfolio_password}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-sethu_admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-$$2a$$12$$dP7DuEoTaUN/x6oFmEXd3e7q0kjCmktTzLp/GKeMi7RwrwbvdNaRq}
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  mysql_data:
