<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | J. Sethuraman Portfolio</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --primary:        #3b82f6;
        --primary-dark:   #1d4ed8;
        --primary-glow:   rgba(59,130,246,0.3);
        --accent:         #8b5cf6;
        --bg:             #0a0e1a;
        --card-bg:        rgba(255,255,255,0.04);
        --card-border:    rgba(255,255,255,0.1);
        --text-primary:   #f1f5f9;
        --text-secondary: #94a3b8;
        --error:          #ef4444;
        --success:        #22c55e;
        --input-bg:       rgba(255,255,255,0.06);
        --input-border:   rgba(255,255,255,0.12);
        --input-focus:    rgba(59,130,246,0.5);
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background */
      .bg-canvas {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.08) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.06) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 80%, rgba(6,182,212,0.05) 0%, transparent 50%);
      }

      .floating-shapes {
        position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
      }

      .shape {
        position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.15;
        animation: float 8s ease-in-out infinite;
      }
      .shape-1 { width: 300px; height: 300px; background: var(--primary); top: -100px; left: -100px; animation-duration: 10s; }
      .shape-2 { width: 200px; height: 200px; background: var(--accent); top: 60%; right: -50px; animation-duration: 14s; animation-delay: -4s; }
      .shape-3 { width: 150px; height: 150px; background: #06b6d4; bottom: -50px; left: 40%; animation-duration: 12s; animation-delay: -2s; }

      @keyframes float {
        0%, 100% { transform: translateY(0) scale(1); }
        50%       { transform: translateY(-30px) scale(1.05); }
      }

      /* Login Card */
      .login-wrapper {
        position: relative; z-index: 1;
        width: 100%; max-width: 420px; padding: 2rem 1.5rem;
      }

      .login-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        animation: cardSlideIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      }

      @keyframes cardSlideIn {
        from { opacity: 0; transform: translateY(30px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .login-logo {
        width: 60px; height: 60px; border-radius: 16px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem; font-weight: 800; color: #fff;
        margin: 0 auto 1.5rem; letter-spacing: -1px;
        box-shadow: 0 8px 20px var(--primary-glow);
      }

      .login-title {
        text-align: center; font-size: 1.5rem; font-weight: 700;
        color: var(--text-primary); margin-bottom: 0.4rem;
      }

      .login-subtitle {
        text-align: center; font-size: 0.875rem; color: var(--text-secondary);
        margin-bottom: 2rem;
      }

      .lock-badge {
        display: inline-flex; align-items: center; gap: 0.4rem;
        background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2);
        border-radius: 20px; padding: 0.25rem 0.75rem;
        font-size: 0.75rem; color: var(--primary); margin-bottom: 2rem;
        animation: pulse-badge 2s ease-in-out infinite;
      }
      @keyframes pulse-badge {
        0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.2); }
        50%      { box-shadow: 0 0 0 6px rgba(59,130,246,0); }
      }

      .header-center { display: flex; flex-direction: column; align-items: center; }

      /* Form */
      .form-group { margin-bottom: 1.25rem; }

      label {
        display: block; font-size: 0.8rem; font-weight: 500;
        color: var(--text-secondary); margin-bottom: 0.5rem; letter-spacing: 0.3px;
      }

      .input-wrap { position: relative; }

      .input-icon {
        position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
        color: var(--text-secondary); pointer-events: none; width: 18px; height: 18px;
      }

      input[type="text"], input[type="password"] {
        width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
        border-radius: 10px; padding: 0.75rem 1rem 0.75rem 2.75rem;
        color: var(--text-primary); font-size: 0.9rem; font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        outline: none;
      }

      input:focus {
        border-color: var(--primary); background: rgba(59,130,246,0.06);
        box-shadow: 0 0 0 3px var(--input-focus);
      }

      input.error { border-color: var(--error); box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }

      .toggle-pw {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: none; border: none; cursor: pointer; color: var(--text-secondary);
        padding: 2px; line-height: 0; transition: color 0.2s;
      }
      .toggle-pw:hover { color: var(--text-primary); }

      /* Error / Success messages */
      .field-error {
        font-size: 0.78rem; color: var(--error); margin-top: 0.35rem;
        display: flex; align-items: center; gap: 0.3rem;
        min-height: 1rem;
      }

      .alert {
        border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 1.25rem;
        font-size: 0.875rem; display: flex; align-items: flex-start; gap: 0.6rem;
        animation: alertIn 0.3s ease;
      }
      @keyframes alertIn {
        from { opacity: 0; transform: translateY(-8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .alert-error {
        background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
      }

      .alert-success {
        background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3);
        color: #86efac;
      }

      /* Submit button */
      .btn-login {
        width: 100%; padding: 0.85rem 1rem; border: none; border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
        letter-spacing: 0.3px; font-family: inherit;
        transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        box-shadow: 0 4px 15px var(--primary-glow);
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      }

      .btn-login:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px var(--primary-glow); }
      .btn-login:active:not(:disabled) { transform: translateY(0); }
      .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

      .btn-spinner {
        width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff; border-radius: 50%; display: none;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .btn-login.loading .btn-text { display: none; }
      .btn-login.loading .btn-spinner { display: block; }

      /* Back link */
      .back-link {
        display: block; text-align: center; margin-top: 1.5rem;
        font-size: 0.85rem; color: var(--text-secondary); text-decoration: none;
        transition: color 0.2s;
      }
      .back-link:hover { color: var(--primary); }

      .divider {
        border: none; border-top: 1px solid var(--card-border);
        margin: 1.5rem 0;
      }

      .security-note {
        text-align: center; font-size: 0.75rem; color: var(--text-secondary);
        display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      }

      /* Responsive */
      @media (max-width: 480px) {
        .login-card { padding: 2rem 1.25rem; }
      }
    </style>
  </head>
  <body>
    <div class="bg-canvas"></div>
    <div class="floating-shapes" aria-hidden="true">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <main class="login-wrapper" role="main">
      <div class="login-card">
        <div class="header-center">
          <div class="login-logo" aria-label="J. Sethuraman Admin">JS</div>
          <h1 class="login-title">Admin Login</h1>
          <p class="login-subtitle">Portfolio Management Dashboard</p>
          <div class="lock-badge" aria-label="Secure area">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            Secure Admin Area
          </div>
        </div>

        <!-- Alert area (shown on login error/success) -->
        <div id="login-alert" role="alert" aria-live="polite" style="display:none;"></div>

        <form id="login-form" novalidate>
          <!-- Username -->
          <div class="form-group">
            <label for="username">Admin Username</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                autocomplete="username"
                aria-required="true"
                aria-describedby="username-error"
              />
            </div>
            <div class="field-error" id="username-error" role="alert"></div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4"/>
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-required="true"
                aria-describedby="password-error"
              />
              <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Show/hide password">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="field-error" id="password-error" role="alert"></div>
          </div>

          <!-- Submit -->
          <button type="submit" id="login-btn" class="btn-login" aria-label="Sign in">
            <span class="btn-spinner" aria-hidden="true"></span>
            <span class="btn-text">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="display:inline;vertical-align:middle;margin-right:6px;">
                <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
              </svg>
              Sign In
            </span>
          </button>
        </form>

        <hr class="divider" />
        <div class="security-note">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Protected by BCrypt &amp; Spring Security
        </div>
      </div>

      <a href="/" class="back-link" aria-label="Back to portfolio">
        ← Back to Portfolio
      </a>
    </main>

    <script>
    (function () {
      "use strict";

      const form      = document.getElementById("login-form");
      const usernameEl = document.getElementById("username");
      const passwordEl = document.getElementById("password");
      const loginBtn   = document.getElementById("login-btn");
      const alertBox   = document.getElementById("login-alert");
      const togglePw   = document.getElementById("toggle-pw");

      const API_BASE = (window.location.protocol === "file:")
        ? "http://localhost:8080/api"
        : "/api";

      // If already logged in, redirect straight to dashboard
      fetch(API_BASE + "/admin/me", { credentials: "include" })
        .then(function (res) {
          if (res.ok) {
            const isFile = window.location.protocol === "file:";
            window.location.href = isFile ? "dashboard.html" : "/admin/dashboard";
          }
        })
        .catch(function () {});

      /* ------- Password show/hide ------- */
      togglePw.addEventListener("click", function () {
        const isText = passwordEl.type === "text";
        passwordEl.type = isText ? "password" : "text";
        document.getElementById("eye-icon").innerHTML = isText
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      });

      /* ------- Show alert ------- */
      function showAlert(message, type) {
        const icon = type === "error"
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
        alertBox.className = "alert alert-" + type;
        alertBox.innerHTML = icon + "<span>" + escHtml(message) + "</span>";
        alertBox.style.display = "flex";
      }

      function hideAlert() { alertBox.style.display = "none"; }

      function escHtml(str) {
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
      }

      /* ------- Field error helpers ------- */
      function setFieldError(input, errorId, msg) {
        input.classList.add("error");
        input.setAttribute("aria-invalid", "true");
        document.getElementById(errorId).textContent = msg;
      }

      function clearFieldError(input, errorId) {
        input.classList.remove("error");
        input.setAttribute("aria-invalid", "false");
        document.getElementById(errorId).textContent = "";
      }

      /* ------- Live validation ------- */
      usernameEl.addEventListener("blur", function () {
        if (!usernameEl.value.trim()) setFieldError(usernameEl, "username-error", "Username is required.");
        else clearFieldError(usernameEl, "username-error");
      });

      passwordEl.addEventListener("blur", function () {
        if (!passwordEl.value) setFieldError(passwordEl, "password-error", "Password is required.");
        else clearFieldError(passwordEl, "password-error");
      });

      /* ------- Form submit ------- */
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        hideAlert();

        const username = usernameEl.value.trim();
        const password = passwordEl.value;

        // Client-side pre-check
        let valid = true;
        if (!username) { setFieldError(usernameEl, "username-error", "Username is required."); valid = false; }
        else clearFieldError(usernameEl, "username-error");
        if (!password) { setFieldError(passwordEl, "password-error", "Password is required."); valid = false; }
        else clearFieldError(passwordEl, "password-error");
        if (!valid) return;

        // Loading state
        loginBtn.classList.add("loading");
        loginBtn.disabled = true;

        try {
          // Build form data for Spring Security form login
          const formData = new URLSearchParams();
          formData.append("username", username);
          formData.append("password", password);

          const resp = await fetch(API_BASE + "/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString(),
            credentials: "include"
          });

          const data = await resp.json().catch(() => null);

          if (resp.ok && data && data.success) {
            showAlert("Login successful! Redirecting to dashboard…", "success");
            setTimeout(function () {
              const isFile = window.location.protocol === "file:";
              window.location.href = isFile ? "dashboard.html" : "/admin/dashboard";
            }, 800);
          } else {
            const msg = (data && data.message) ? data.message : "Invalid username or password.";
            showAlert(msg, "error");
            passwordEl.value = "";
            passwordEl.focus();
          }
        } catch (err) {
          showAlert("Could not connect to the server. Make sure the backend is running.", "error");
        } finally {
          loginBtn.classList.remove("loading");
          loginBtn.disabled = false;
        }
      });
    })();
    </script>
  </body>
</html>
