<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | J. Sethuraman Portfolio</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // GitHub Pages SPA routing fixer
      // If user navigated to an extension-less route like /admin/login or /admin/dashboard
      (function () {
        var pathname = window.location.pathname;
        if (pathname.endsWith("/admin/login") || pathname.endsWith("/admin/login/")) {
          var target = pathname.replace(/\/admin\/login\/?$/, "/admin/login.html") + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }
        if (pathname.endsWith("/admin/dashboard") || pathname.endsWith("/admin/dashboard/")) {
          var target = pathname.replace(/\/admin\/dashboard\/?$/, "/admin/dashboard.html") + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }
        if (pathname.endsWith("/admin") || pathname.endsWith("/admin/")) {
          var target = pathname.replace(/\/admin\/?$/, "/admin/login.html") + window.location.search + window.location.hash;
          window.location.replace(target);
          return;
        }
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0a0e1a;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 480px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 3rem 2rem;
        backdrop-filter: blur(20px);
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      }
      .code {
        font-size: 5rem;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
      .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.75rem 1.25rem;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s, opacity 0.15s;
      }
      .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: #fff;
      }
      .btn-secondary {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        color: #f1f5f9;
      }
      .btn:hover { transform: translateY(-1px); opacity: 0.95; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has moved.</p>
      <div class="actions">
        <a href="index.html" class="btn btn-primary">← Back to Portfolio</a>
        <a href="admin/login.html" class="btn btn-secondary">Admin Login</a>
      </div>
    </div>
  </body>
</html>
